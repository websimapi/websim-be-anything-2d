<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Anything 2D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "./config.js": "./config.js"
      }
    }
  </script>
</head>
<body>
  <div id="container">
    <h1>Be Anything 2D</h1>
    <div id="input-area">
      <label for="prompt" class="sr-only">Describe your character:</label>
      <input type="text" id="prompt" name="prompt" placeholder="e.g., a brave knight riding a giant snail">
      <button id="create-button" type="button">Create</button>
    </div>
    <!-- Error Message Area -->
    <div id="error-message" style="display: none; color: #D8000C; background-color: #FFD2D2; border: 1px solid; margin: 10px 0px; padding: 10px; border-radius: 3px;"></div>
    <!-- Loading Indicator Area -->
    <div id="loading-indicator" style="display: none;">
      <p>Generating character...</p>
      <div class="spinner"></div>
    </div>
    <!-- Scene Container -->
    <div id="scene-container">
        <!-- Canvas will be added here by Three.js -->
    </div>
    <p class="instructions">Click in the scene to move your character!</p>
  </div>
  <script type="module" src="main.js"></script>

</body>
</html>
